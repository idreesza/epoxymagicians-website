<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thank You | Epoxy Magicians</title>
<meta name="description" content="Thanks for requesting a free estimate from Epoxy Magicians. We'll be in touch within 24 hours.">
<link rel="canonical" href="https://epoxymagicians.com/thank-you/">
<meta name="robots" content="noindex,follow">
<meta name="theme-color" content="#0d1b2a">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
<style>
:root{--navy:#0d1b2a;--ink:#14202b;--muted:#4a5a68;--brand:#ff6a00;--brand-hover:#e85d00;--gold:#f5b301;--line:#dfe5ea;--wrap:1160px;--font:"Inter",system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-family:var(--font);color:var(--ink);line-height:1.6}
.wrap{max-width:var(--wrap);margin-inline:auto;padding-inline:20px}
.btn{display:inline-flex;align-items:center;gap:.5rem;font-weight:700;text-decoration:none;border-radius:10px;padding:14px 22px;min-height:48px}
.btn-cta{background:var(--brand);color:var(--navy)}.btn-cta:hover{background:var(--brand-hover)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.brand{font-weight:800;font-size:1.15rem;color:var(--navy);text-decoration:none}.brand span{color:var(--brand)}
header{padding:20px 0;border-bottom:1px solid var(--line)}
.hero{text-align:center;padding:80px 20px;max-width:600px;margin-inline:auto}
.hero .check{width:64px;height:64px;border-radius:50%;background:#0a7d3c;color:#fff;display:flex;align-items:center;justify-content:center;font-size:2rem;margin:0 auto 20px}
h1{font-size:2rem;margin:0 0 12px;color:var(--navy)}
p{color:var(--muted);font-size:1.05rem}
</style>
</head>
<body>
<header><div class="wrap"><a class="brand" href="/">Epoxy<span>Magicians</span></a></div></header>
<main class="hero">
  <div class="check" aria-hidden="true">✓</div>
  <h1>Thank you — request received</h1>
  <p>We typically reply with a written estimate within 24–48 hours. Need it faster? Call or text us directly at <a href="tel:+12544355877">(254) 435-5877</a>.</p>
  <p><a class="btn btn-cta" href="/">Back to homepage</a></p>
</main>
</body>
</html>
